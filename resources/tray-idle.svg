<!--
  The menu-bar mark, idle. Source for resources/trayTemplate.png and its @2x
  sibling; `npm run icons` renders it.

  Black on transparent, deliberately: macOS template images carry no colour of
  their own — only alpha — and the OS inverts them for a light or dark menu bar.
  That is why the app's azure appears nowhere here, and why the "active" variant
  cannot simply add a green dot (see tray-active.svg).

  The same hub as the app icon, but re-drawn rather than scaled down. The app
  icon's proportions — nodes at 170/342 of 512, 12-wide channels — collapse into
  a single black starfish at 16px, which is the size that actually matters here.
  So the ink is thinner and the composition wider than the icon's:

    * nodes pushed out to 4.6/19.4 of 24, near the edges, because the OS supplies
      the menu-bar padding and any we add is padding twice
    * channels at 1.5 (one device pixel at 16px) and starting at 7.6, which
      leaves ~1.2px of clear between a node and the channel pointing at it
    * no rings inside the nodes and no ring inside the core; at 16px a 1px ring
      is a grey smudge, and the filled discs are what read
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <path d="M 7.6 7.6 L 12 12 M 16.4 7.6 L 12 12 M 7.6 16.4 L 12 12 M 16.4 16.4 L 12 12"
    stroke="#000000" stroke-width="1.5" stroke-linecap="round" />
  <g fill="#000000">
    <circle cx="4.6" cy="4.6" r="1.8" />
    <circle cx="19.4" cy="4.6" r="1.8" />
    <circle cx="4.6" cy="19.4" r="1.8" />
    <circle cx="19.4" cy="19.4" r="1.8" />
    <circle cx="12" cy="12" r="2.8" />
  </g>
</svg>
