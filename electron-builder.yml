appId: com.stevevillardi.switchboard
productName: Switchboard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
  # Both agent SDKs shell out to a vendored native binary, which cannot be
  # executed from inside an asar archive. The platform-specific packages
  # (@openai/codex-darwin-arm64, @anthropic-ai/claude-agent-sdk-darwin-arm64,
  # ...) are where the actual executables live, so the globs are deliberately
  # wide enough to catch those siblings and not just the umbrella package.
  - '**/node_modules/@openai/codex*/**'
  - '**/node_modules/@anthropic-ai/claude-agent-sdk*/**'
extraResources:
  - from: drizzle
    to: drizzle
win:
  executableName: switchboard
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target: dir
  # Load-bearing, not cosmetic. safeStorage seals every stored credential with a
  # keychain key whose ACL trusts the app's *code identity*; unsigned, that
  # identity is a hash of the binary, so each rebuilt Electron was a new app to
  # the keychain and the stored GitHub token read as locked. A Developer ID
  # signature makes the designated requirement identifier + team instead, which
  # survives rebuilds and Electron upgrades. See docs/plan/18-switchboard.md.
  #
  # Selected by SHA-1 rather than by name because this keychain holds two
  # distinct, both-valid "Developer ID Application: Steve Villardi (VZ5TTKF948)"
  # certificates -- that ambiguity is what defeated auto-discovery when signing
  # was first skipped. Both carry team VZ5TTKF948 and therefore produce the same
  # designated requirement, so swapping certs on expiry will not invalidate the
  # keychain grant. scripts/sign-dev-electron.sh reads this exact line.
  identity: 2CA9C0B374C903DC12D7236A041DC1E171B9B302
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
